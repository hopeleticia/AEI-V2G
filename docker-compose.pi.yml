        --duration ${AEI_DURATION_SECONDS:-600}
        --output reports/pi3_metrics.json
        --chain data/pi3_chain.jsonl
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    environment:
      AEI_NODE_ROLE: station-validator
      AEI_NODE_ID: pi3
      AEI_MQTT_BROKER: ${AEI_MQTT_BROKER:-mqtt-broker}
      AEI_STATION_IDS: station_c
      AEI_ETH_RPC_URL: ${AEI_ETH_RPC_URL:-https://purechainnode.com:8547}
      AEI_ETH_ACCOUNT: ${AEI_ETH_ACCOUNT:-}
      AEI_ETH_PRIVATE_KEY: ${AEI_ETH_PRIVATE_KEY:-}
      AEI_CREDIT_LEDGER_ADDRESS: ${AEI_CREDIT_LEDGER_ADDRESS:-}
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "1.0"

  # ── pi5: RSU observer ──────────────────────────────────────────────────────
  pi5-rsu-observer:
    image: aei-v2g:pi
    profiles: ["pi5", "local"]
    command: >
      python -m integration.coordinator
        --config config/corridor_config.yaml
        --duration ${AEI_DURATION_SECONDS:-600}
        --output reports/pi5_metrics.json
        --chain data/pi5_chain.jsonl
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
    environment:
      AEI_NODE_ROLE: rsu-observer
      AEI_NODE_ID: pi5
      AEI_MQTT_BROKER: ${AEI_MQTT_BROKER:-mqtt-broker}
      AEI_ETH_RPC_URL: ${AEI_ETH_RPC_URL:-https://purechainnode.com:8547}
      AEI_ETH_ACCOUNT: ${AEI_ETH_ACCOUNT:-}
      AEI_ETH_PRIVATE_KEY: ${AEI_ETH_PRIVATE_KEY:-}
      AEI_CREDIT_LEDGER_ADDRESS: ${AEI_CREDIT_LEDGER_ADDRESS:-}
    restart: on-failure
    deploy:
      resources:
        limits:
